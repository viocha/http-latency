version: '3'

tasks:
  default:
    desc: 检查并构建 arm64-v8a Debug APK
    cmds:
      - task: check
      - task: build

  get:
    desc: 安装 Flutter 依赖
    cmds:
      - flutter pub get

  format:
    desc: 格式化 Dart 源码与测试
    cmds:
      - dart format lib test

  analyze:
    desc: 运行 Flutter 静态检查
    cmds:
      - flutter analyze

  test:
    desc: 运行全部测试
    cmds:
      - flutter test

  check:
    desc: 依次运行静态检查和测试
    cmds:
      - task: analyze
      - task: test

  arm64:
    desc: 构建手机用 arm64-v8a Debug APK
    cmds:
      - flutter build apk --debug --target-platform android-arm64 --split-per-abi

  build:
    desc: 构建 arm64-v8a Debug APK
    cmds:
      - task: arm64

  install-usb:
    desc: 构建 Debug APK 并安装到 USB 设备
    cmds:
      - task: arm64
      - adb -d install -r build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk

  release-arm64:
    desc: 构建手机用 arm64-v8a Release APK
    cmds:
      - flutter build apk --release --target-platform android-arm64 --split-per-abi

  release:
    desc: 构建 arm64-v8a Release APK
    cmds:
      - task: release-arm64

  windows-run:
    desc: 在 Windows 桌面运行 Debug 版本
    cmds:
      - flutter run -d windows

  windows-debug:
    desc: 构建 Windows Debug 版本
    cmds:
      - flutter build windows --debug

  windows-release:
    desc: 构建 Windows Release 版本
    cmds:
      - flutter build windows --release
